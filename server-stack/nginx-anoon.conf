# =============================================================================
# anoon — nginx vhost for a shared host (see compose.behind-proxy.yml).
#
# Install as its OWN file so neighbouring sites are never edited:
#   /etc/nginx/sites-available/anoon  +  symlink in sites-enabled/
#   nginx -t && systemctl reload nginx
# A bad config fails `nginx -t` and the reload is refused — the running server
# keeps serving the old one, so the neighbours cannot be taken down by this file.
#
# TLS is issued by certbot for these hostnames. No domain purchase is needed:
# sslip.io resolves <anything>.<dashed-ip>.sslip.io to that IP, which satisfies
# the ACME HTTP-01 challenge. A bare IP could not — Let's Encrypt does not issue
# for IPs — and plain HTTP is not an option either, because the app needs a
# secure context for the service worker, web push and getUserMedia (calls).
#
# Everything is proxied to Caddy on loopback, which does the single-origin
# routing. Two rules matter here and are easy to get wrong:
#   * Host is passed through unchanged — Caddy selects the site by it;
#   * Upgrade/Connection are forwarded, or every WebSocket dies: the Tinode
#     socket, the companion event socket, "typing", presence and call signalling
#     all ride on them.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name APP_HOST ADMIN_HOST;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name APP_HOST ADMIN_HOST;

    ssl_certificate     /etc/letsencrypt/live/APP_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_HOST/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Media upload ceiling. Caddy caps bodies at 128MB; nginx defaults to 1MB
    # and would reject an ordinary photo long before Caddy ever saw it.
    client_max_body_size 128M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSockets. Without these two the connection is answered as a plain
        # request and the client sees a chat that silently never updates.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Host unchanged: Caddy routes by it, and the app builds absolute URLs
        # from it. $scheme is https here, so the backend knows it is not plain.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived sockets: the default 60s read timeout would drop an idle
        # chat every minute and make the app look like it keeps reconnecting.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
