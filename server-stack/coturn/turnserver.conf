# =============================================================================
# anoon — coturn (TURN/STUN relay) production config
#
# Mounted read-only at /etc/coturn/turnserver.conf by compose.prod.yml.
#
# Why TURN: WebRTC calls connect peer-to-peer when they can (STUN is enough for
# most NATs), but ~10–20% of pairs — symmetric NAT, strict mobile carriers —
# can only talk through a relay. Without TURN those calls just never connect.
#
# Static settings ONLY live here (a coturn .conf cannot read env vars).
# Deployment-specific values are passed as CLI args by compose.prod.yml, where
# ${VAR} interpolation works:
#   --realm=$TURN_REALM  --user=$TURN_USER:$TURN_PASS
#   --external-ip=$(detect-external-ip)      (docker NAT: advertise the real IP)
#   --cert/--pkey=<caddy certificate paths>  (TLS on 5349)
# =============================================================================

# --- Listeners ---------------------------------------------------------------
# Plain TURN/STUN (UDP+TCP) and TLS TURN (turns:). Both published by compose.
listening-port=3478
tls-listening-port=5349

# --- Relay port range ----------------------------------------------------------
# Deliberately NARROW (41 UDP ports ≈ ~40 concurrent relayed streams ≈ ~20
# worst-case calls) so compose does not have to publish thousands of ports.
# Scale up: widen this range AND the matching ports: block in compose.prod.yml
# AND the ufw rule in deploy-hetzner.sh — all three must agree.
min-port=49160
max-port=49200

# --- Authentication ------------------------------------------------------------
# Long-term credential mechanism with ONE static user (passed via --user on the
# command line). The same credentials are baked into the frontend bundle
# (NEXT_PUBLIC_TURN_*), i.e. they are PUBLIC by design — the quotas and the
# denied-peer list below are what actually bound abuse. Upgrade path when it
# matters: switch to use-auth-secret + companion-minted ephemeral credentials.
lt-cred-mech
fingerprint

# --- Abuse bounds ----------------------------------------------------------------
# One shared username → per-user quota is meaningless; cap globally instead.
# total-quota = max concurrent allocations; the port range caps it anyway.
total-quota=200
# Per-session bandwidth cap: 3 Mbit/s — plenty for a 720p call leg.
max-bps=3000000
# WebRTC needs UDP relay only; TCP relay (RFC 6062) is an abuse vector — off.
no-tcp-relay
no-multicast-peers

# --- Do NOT relay into internal networks -----------------------------------------
# A TURN server will happily open connections to any IP a client asks for.
# Block private/link-local/metadata ranges so the relay cannot be used to
# reach the docker network, the host, or cloud metadata endpoints.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- Hardening / ops ---------------------------------------------------------------
# Telnet admin console stays OFF (coturn >= 4.14 default; the old `no-cli`
# option is deprecated — enable would be `cli`). No filesystem log: docker
# captures stdout.
log-file=stdout
new-log-timestamp
